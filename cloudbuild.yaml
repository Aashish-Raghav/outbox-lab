# Cloud Build config for both images.
#
# `gcloud run deploy --source` is not usable here: it looks for a Dockerfile at
# the root of the build context, and this is a monorepo producing two images
# from one context (npm workspaces need the root lockfile, so the context
# cannot be narrowed to apps/api or apps/web).
#
# Build the API:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_IMAGE=<img>,_DOCKERFILE=apps/api/Dockerfile
#
# Build the dashboard (API_ORIGIN must be the API's real URL — Next bakes the
# /api/* rewrite into the build):
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_IMAGE=<img>,_DOCKERFILE=apps/web/Dockerfile,_API_ORIGIN=https://…

substitutions:
  _IMAGE: ''
  _DOCKERFILE: ''
  _API_ORIGIN: 'http://localhost:4000'

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -f
      - '${_DOCKERFILE}'
      - --build-arg
      - 'API_ORIGIN=${_API_ORIGIN}'
      - -t
      - '${_IMAGE}'
      - .

images:
  - '${_IMAGE}'

options:
  # The default e2-medium spends most of the build in `npm ci` for a monorepo
  # with Next, Tiptap and Prisma in it. More cores is materially faster.
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
